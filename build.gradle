plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.mod_id
}

repositories {
	mavenLocal()
}

dependencies {
	// Optional: village-quests integration (compile-only, not bundled at runtime)
	if (file("../village-quests/build/libs/village-quests-1.0.0.jar").exists()) {
		compileOnly files("../village-quests/build/libs/village-quests-1.0.0.jar")
	}

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Pandorical — client-enablement library used for structure rendering, camera hints,
	// and content sync (replaces Polymer entirely)
	implementation(project(':pandorical'))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
